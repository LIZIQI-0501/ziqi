<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="象志日记本">
  <title>日记｜象志</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .journal{max-width:1120px;margin:auto;padding:48px 5vw 84px}.journal-top{display:flex;align-items:start;justify-content:space-between;gap:24px}.journal h1{font-size:clamp(2.6rem,6vw,5.4rem);line-height:1;margin:.15em 0}.journal-card{margin-top:26px;padding:28px;border:1px solid #d8cfae;border-radius:22px;background:#fffdf6;box-shadow:0 12px 35px #18352d0d}.journal-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,.72fr);gap:24px}.journal-form{display:grid;gap:15px}.journal-form label{display:grid;gap:7px;color:#496157;font-weight:700}.journal-form input,.journal-form textarea,.journal-form select{box-sizing:border-box;width:100%;padding:13px 15px;border:1px solid #b9ccbe;border-radius:12px;background:#fff;color:#173b31;font:inherit}.journal-form textarea{min-height:185px;resize:vertical}.journal button{border:0;border-radius:999px;padding:12px 18px;background:#17624f;color:#fff;font:inherit;font-weight:700;cursor:pointer}.journal button.secondary{background:#edf4eb;color:#1e5749}.journal button.danger{background:#fbe8df;color:#8d3924}.journal-actions{display:flex;gap:10px;flex-wrap:wrap}.journal-list{display:grid;gap:12px}.journal-entry{width:100%;text-align:left;border:1px solid #d8e0d3;border-radius:16px;padding:16px;background:#fff;color:#173b31}.journal-entry:hover{border-color:#5b8d78}.journal-entry strong{display:block;font-size:1.08rem}.journal-entry small{display:block;margin-top:7px;color:#61766c}.sticker{float:right;font-size:1.45rem}.empty{padding:24px;border:1px dashed #b9ccbe;border-radius:16px;color:#61766c}.note{color:#61766c}@media(max-width:760px){.journal-top,.journal-grid{display:grid;grid-template-columns:1fr}.journal{padding-top:30px}}
  </style>
</head>
<body>
  <header id="siteHeader"></header>
  <main id="app"></main>
  <footer id="siteFooter"></footer>
  <script src="diary-page.js"></script>
</body>
</html>
